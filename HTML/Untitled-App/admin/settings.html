  <script>

  // ==========================================================
  // SHARED: DATABASE (sample data, loading and saving)
  // ==========================================================
  var STORAGE_KEY = "untitled-data-v2";
  var ME = "o1"; // the organiser who is "logged in" on the Organiser pages
  var DB = null; // the whole database

  // dates are text like 2026-11-20
  function dateFromToday(days) {
    var d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  }

  function loadDB() {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      DB = JSON.parse(saved);
    } else {
      DB = makeSampleData();
      saveDB();
    }
  }

  function saveDB() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  }

  function resetDB() {
    localStorage.removeItem(STORAGE_KEY);
    loadDB();
  }

  function newId(prefix) {
    return prefix + Date.now().toString(36) + Math.floor(Math.random() * 1000);
  }

  function getEvent(id) {
    return DB.events.find(function (e) { return e.id === id; });
  }

  function getUser(id) {
    return DB.users.find(function (u) { return u.id === id; });
  }

  function getTiersFor(eventId) {
    return DB.tiers.filter(function (t) { return t.eventId === eventId; });
  }

  // Add a line to the audit log (the Admin "Audit log" page shows these)
  function addAudit(actor, action, detail) {
    DB.audit.unshift({ id: newId("a"), time: new Date().toISOString(), actor: actor, action: action, target: detail });
    saveDB();
  }

  // Totals for one event: tickets sold, money, orders (refunded orders do not count)
  function eventStats(eventId) {
    var sold = 0, revenue = 0, orders = 0;
    DB.orders.forEach(function (o) {
      if (o.eventId === eventId && o.status !== "Refunded") {
        sold += o.qty;
        revenue += o.total;
        orders += 1;
      }
    });
    return { sold: sold, revenue: revenue, orders: orders };
  }

  // Change an event's status and write it in the audit log
  function setEventStatus(eventId, status, actor, note) {
    var event = getEvent(eventId);
    event.status = status;
    if (note !== undefined) event.note = note;
    saveDB();
    addAudit(actor, "Set event to " + status, event.title);
  }

  // Reports that are still waiting for an admin (New or Open)
  function openReports() {
    return DB.reports.filter(function (r) { return r.status !== "Closed"; });
  }

  // Word the Admin sees for an event: Live, Review, Flagged, Draft, Rejected, Cancelled
  function adminEventStatus(event) {
    if (event.status === "Published") {
      var flagged = openReports().some(function (r) { return r.type === "Event" && r.targetId === event.id; });
      return flagged ? "Flagged" : "Live";
    }
    if (event.status === "Pending") return "Review";
    return event.status;
  }

  // ==========================================================
  // SHARED: HELPERS (formatting, pop-ups, toast, CSV)
  // ==========================================================
  // Make text safe to put inside HTML
  function esc(text) {
    return String(text === undefined || text === null ? "" : text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function money(n) {
    return "$" + Number(n).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatDate(text) {
    if (!text) return "";
    var d = new Date(text.length === 10 ? text + "T12:00:00" : text);
    return d.toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" });
  }

  // "14 Jun" style, used in page labels
  function shortDate(text) {
    var d = new Date(text + "T12:00:00");
    return d.getDate() + " " + d.toLocaleDateString("en-CA", { month: "short" });
  }

  // "10:42" for today's entries, otherwise "Nov 3, 10:42"
  function formatTime(text) {
    var d = new Date(text);
    var clock = d.toLocaleTimeString("en-CA", { hour: "2-digit", minute: "2-digit", hour12: false });
    if (Date.now() - d.getTime() < 86400000) return clock;
    return d.toLocaleDateString("en-CA", { month: "short", day: "numeric" }) + ", " + clock;
  }

  // A coloured pill for a status word
  function tag(status) {
    var colours = {
      Live: "accent", Published: "ok", Active: "ok", Paid: "ok", Resolved: "ok", Verified: "ok",
      Review: "warn", Pending: "warn", Ready: "warn", Open: "dark", New: "outline", Invited: "warn", Held: "warn", Flagged: "warn", "Test mode": "warn", Scheduled: "warn",
      Rejected: "bad", Suspended: "bad", Dispute: "bad", Cancelled: "bad", "Sold out": "dark",
      Draft: "grey", Refunded: "grey", Closed: "outline", Past: "grey", Dismissed: "grey"
    };
    return '<span class="tag ' + (colours[status] || "grey") + '">' + esc(status) + "</span>";
  }

  // The word an organiser sees for their own event
  function organiserStatus(event) {
    if (event.status === "Published") return event.date < dateFromToday(0) ? "Past" : "Live";
    if (event.status === "Pending") return "Review";
    return event.status;
  }

  // Read a value from the page address, e.g. ?id=e1
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  // Attach a click to every element matching the selector.
  // The function gets the value of the data attribute (e.g. data-open="e1" gives "e1").
  function onClickAll(selector, dataName, action) {
    document.querySelectorAll(selector).forEach(function (el) {
      el.onclick = function (e) {
        e.stopPropagation();
        action(el.dataset[dataName]);
      };
    });
  }

  // ---------- toast (small message at the bottom) ----------
  function showToast(message, isError) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var box = document.createElement("div");
    box.className = "toast" + (isError ? " bad" : "");
    box.textContent = message;
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 2800);
  }

  // ---------- modal (pop-up window) ----------
  // buttons: [{ text: "Save", className: "primary", onClick: function () { ... } }]
  // If onClick returns false the modal stays open (used when a form has an error).
  function openModal(title, bodyHtml, buttons) {
    closeModal();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "modal-overlay";
    overlay.innerHTML =
      '<div class="modal">' +
        '<div class="modal-head"><h2>' + esc(title) + '</h2><button class="modal-close" id="modal-x">&times;</button></div>' +
        '<div class="modal-body">' + bodyHtml + "</div>" +
        '<div class="modal-foot" id="modal-foot"></div>' +
      "</div>";
    document.body.appendChild(overlay);

    var foot = document.getElementById("modal-foot");
    (buttons || []).forEach(function (b) {
      var button = document.createElement("button");
      button.className = "btn " + (b.className || "");
      button.textContent = b.text;
      button.onclick = function () {
        var result = b.onClick ? b.onClick() : true;
        if (result !== false) closeModal();
      };
      foot.appendChild(button);
    });

    document.getElementById("modal-x").onclick = closeModal;
    overlay.onclick = function (e) { if (e.target === overlay) closeModal(); };
  }

  function closeModal() {
    var overlay = document.getElementById("modal-overlay");
    if (overlay) overlay.remove();
  }

  // Ask "are you sure?" and run a function if the user says yes
  function confirmBox(title, message, yesText, onYes, isDanger) {
    openModal(title, '<p class="muted">' + message + "</p>", [
      { text: "Cancel" },
      { text: yesText, className: isDanger ? "danger-solid" : "primary", onClick: onYes }
    ]);
  }

  // ---------- download a CSV file ----------
  // rows is a list of lists: [["Name","Email"],["Ava","ava@x.test"]]
  function downloadCSV(filename, rows) {
    var text = rows.map(function (row) {
      return row.map(function (cell) { return '"' + String(cell).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    var link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
    link.download = filename;
    link.click();
  }

  // ---------- simple pager for long tables ----------
  function pageOf(rows, page, size) {
    var start = (page - 1) * size;
    return rows.slice(start, start + size);
  }

  function pagerHtml(total, page, size) {
    var pages = Math.max(1, Math.ceil(total / size));
    if (pages === 1) return "<span>" + total + " results</span>";
    return "<span>" + total + " results</span><span>" +
      '<button class="btn small" data-page="' + (page - 1) + '"' + (page <= 1 ? " disabled" : "") + ">Previous</button> " +
      " Page " + page + " of " + pages + " " +
      '<button class="btn small" data-page="' + (page + 1) + '"' + (page >= pages ? " disabled" : "") + ">Next</button></span>";
  }

  // The "Reset demo data" link in the footer / sidebar
  function hookResetLink() {
    document.getElementById("reset-link").onclick = function (e) {
      e.preventDefault();
      confirmBox("Reset demo data", "This puts all events, orders, users and settings back to the starting sample data.", "Reset", function () {
        resetDB();
        sessionStorage.clear();
        window.location.reload();
      }, true);
    };
  }

  // ---------- log in / log out and the round account button ----------
  var LOGGED_OUT_KEY = "untitled-logged-out";

  function isLoggedOut() {
    try { return sessionStorage.getItem(LOGGED_OUT_KEY) === "1"; } catch (e) { return false; }
  }

  // Log out: remember it for this tab and go back to the start page.
  function logOut() {
    try { sessionStorage.setItem(LOGGED_OUT_KEY, "1"); } catch (e) {}
    window.location.href = "../index.html";
  }

  // Pages call this first: if you logged out, go back to the start page.
  function requireLogin() {
    if (isLoggedOut()) window.location.replace("../index.html");
  }

  // "Kamloops Live" -> "KL"
  function initialsOf(name) {
    var words = String(name).trim().split(/\s+/);
    var letters = words[0].charAt(0) + (words.length > 1 ? words[words.length - 1].charAt(0) : "");
    return letters.toUpperCase();
  }

  // The orange circle with a drop-down menu. topHtml is shown above the links.
  function accountMenuHtml(name, topHtml, linksHtml) {
    return '<div class="menu-wrap">' +
        '<button class="avatar" id="avatar-btn" aria-haspopup="true" aria-expanded="false" title="Account menu">' + esc(initialsOf(name)) + "</button>" +
        '<div class="menu" id="avatar-menu" hidden>' + topHtml + linksHtml +
          '<a href="#" id="logout-link" class="logout">Log out</a>' +
        "</div>" +
      "</div>";
  }

  // Open and close the menu, and make "Log out" work.
  function hookAccountMenu() {
    var button = document.getElementById("avatar-btn");
    var menu = document.getElementById("avatar-menu");

    function setOpen(open) {
      menu.hidden = !open;
      button.setAttribute("aria-expanded", open ? "true" : "false");
    }
    button.onclick = function (e) { e.stopPropagation(); setOpen(menu.hidden); };
    document.onclick = function (e) { if (!menu.contains(e.target)) setOpen(false); };
    document.onkeydown = function (e) { if (e.key === "Escape") setOpen(false); };
    document.getElementById("logout-link").onclick = function (e) { e.preventDefault(); logOut(); };
  }


  // ==========================================================
  // SHARED: PAGE FRAME (sidebar and top bar)
  // ==========================================================
  var ADMIN_NAME = "Mia Tremblay"; // the admin who is "logged in" (used in the audit log)

  function buildAdminFrame(activePage) {
    requireLogin();
    var tabs = [
      ["overview.html", "Overview", "01"],
      ["events.html", "Events", "02"],
      ["orders.html", "Orders", "03"],
      ["users.html", "Users", "04"],
      ["payouts.html", "Payouts", "05"],
      ["reports.html", "Reports", "06"],
      ["settings.html", "Settings", "07"],
      ["audit-log.html", "Audit log", "08"]
    ];
    var tabHtml = tabs.map(function (t) {
      return '<a href="' + t[0] + '"' + (t[0] === activePage ? ' class="active"' : "") + ">" + t[1] + '<span class="num">' + t[2] + "</span></a>";
    }).join("");

    document.getElementById("sidebar").innerHTML =
      '<a class="brand" href="overview.html">UNTITLED <span class="pill">ADMIN</span></a>' +
      "<nav>" + tabHtml + "</nav>" +
      '<div class="bottom">' +
        '<a href="../organiser/my-events.html">Switch to Organiser</a>' +
        '<a href="#" id="reset-link">Reset demo data</a>' +
      "</div>";

    document.getElementById("topbar").innerHTML =
      '<input type="text" id="global-search" placeholder="Search orders, users, events">' +
      accountMenuHtml(ADMIN_NAME, "", "");

    // Press Enter in the search box to search the Orders page
    document.getElementById("global-search").onkeydown = function (e) {
      if (e.key === "Enter" && this.value.trim() !== "") {
        window.location.href = "orders.html?q=" + encodeURIComponent(this.value.trim());
      }
    };
    hookResetLink();
    hookAccountMenu();
  }


  // ==========================================================
  // THIS PAGE: settings.html
  // ==========================================================
  buildAdminFrame("settings.html");

  var TABS = [
    ["general", "General"],
    ["customers", "Customers"],
    ["organisers", "Organisers"],
    ["admins", "Admins and roles"],
    ["payments", "Payments and payouts"],
    ["notifications", "Notifications"]
  ];

  // What each tab contains. type: text, number, toggle, select or seg (buttons).
  var CONFIG = {
    general: [
      { title: "Platform", rows: [
        { key: "platformName", label: "Platform name", help: "Shown in the header and in emails", type: "text" },
        { key: "supportEmail", label: "Support email", help: "Where customer replies go", type: "text" },
        { key: "currency", label: "Currency", help: "Prices and payouts", type: "seg", options: ["CAD", "USD"] },
        { key: "timezone", label: "Time zone", help: "Used for event times and reports", type: "select", options: ["Pacific Time (Vancouver)", "Eastern Time (Toronto)", "UTC"] }
      ] },
      { title: "Event categories", categories: true },
      { title: "Availability", rows: [
        { key: "maintenance", label: "Maintenance mode", help: "Shows a notice and pauses checkout", type: "toggle" }
      ] }
    ],
    customers: [
      { title: "Buying", rows: [
        { key: "ticketsPerOrder", label: "Tickets per order", help: "Most a buyer can add to one order", type: "number", min: 1, max: 50 },
        { key: "seatHold", label: "Seat hold timer", help: "How long seats stay held at checkout", type: "number", min: 1, max: 60, suffix: "minutes" },
        { key: "guestCheckout", label: "Guest checkout", help: "Let buyers purchase without an account", type: "toggle" },
        { key: "emailVerify", label: "Email verification", help: "Require a verified email before buying", type: "toggle" }
      ] },
      { title: "Refunds", rows: [
        { key: "refundWindow", label: "Refund window", help: "Cut-off before the event starts", type: "number", min: 0, max: 720, suffix: "hours" },
        { key: "refundMethod", label: "Refund method", help: "Where money goes back", type: "seg", options: ["Original payment", "Credit"] },
        { key: "lateRefunds", label: "Late refund requests", help: "Customers can ask outside the window", type: "toggle" }
      ] },
      { title: "Accounts", rows: [
        { key: "flagAfter", label: "Flag account after", help: "Reports before an account is flagged", type: "number", min: 1, max: 20, suffix: "reports" },
        { key: "autoSuspend", label: "Auto-suspend flagged accounts", help: "Otherwise an admin reviews each one", type: "toggle" }
      ] }
    ],
    organisers: [
      { title: "Event approval", rows: [
        { key: "requireApproval", label: "Require approval", help: "New events wait for an admin before going live", type: "toggle" },
        { key: "autoApproveVerified", label: "Auto-approve verified organisers", help: "Skip review for trusted organisers", type: "toggle" },
        { key: "reviewTarget", label: "Review target", help: "Time to review a submitted event", type: "number", min: 1, max: 168, suffix: "hours" }
      ] },
      { title: "Fees", rows: [
        { key: "serviceFee", label: "Service fee", help: "Percentage of each order", type: "number", min: 0, max: 30, suffix: "%" },
        { key: "perTicketFee", label: "Per-ticket fee", help: "Flat amount added to each ticket", type: "number", min: 0, max: 20, step: 0.05, suffix: "CAD" },
        { key: "feePaidBy", label: "Fee paid by", help: "Who sees the fee at checkout", type: "seg", options: ["Buyer", "Organiser"] }
      ] },
      { title: "Limits", rows: [
        { key: "maxCapacity", label: "Capacity per event", help: "Largest event an organiser can create", type: "number", min: 1, max: 1000000 },
        { key: "maxTicketTypes", label: "Ticket types per event", help: "Most tiers on one event", type: "number", min: 1, max: 50 },
        { key: "bankBeforePublish", label: "Bank details before publishing", help: "Organiser must link a bank account", type: "toggle" }
      ] }
    ],
    payments: [
      { title: "Payments", rows: [
        { key: "provider", label: "Payment provider", help: "Processes card payments", type: "select", options: ["Stripe", "Square", "PayPal"], badge: "Test mode" },
        { key: "taxRate", label: "Tax rate", help: "Applied to ticket price", type: "number", min: 0, max: 30, step: 0.5, suffix: "% GST" },
        { key: "descriptor", label: "Statement descriptor", help: "Shown on card statements", type: "text" }
      ] },
      { title: "Payouts", rows: [
        { key: "payoutDelay", label: "Payout schedule", help: "When organisers are paid", type: "number", min: 0, max: 30, suffix: "days after event" },
        { key: "minPayout", label: "Minimum payout", help: "Smaller balances roll over", type: "number", min: 0, max: 10000, suffix: "CAD" },
        { key: "holdDisputes", label: "Hold during disputes", help: "Pause payouts while a dispute is open", type: "toggle" },
        { key: "verifiedBank", label: "Verified bank required", help: "No payout without a verified account", type: "toggle" }
      ] }
    ],
    notifications: [
      { title: "Email me when", rows: [
        { key: "notifyApproval", label: "New event awaiting approval", help: "Sent to the admin team", type: "toggle" },
        { key: "notifyPayout", label: "Payout ready for release", help: "Finance is notified", type: "toggle" },
        { key: "notifyReport", label: "New report filed", help: "Moderators are notified", type: "toggle" },
        { key: "notifyDispute", label: "Dispute opened", help: "Finance is notified", type: "toggle" },
        { key: "notifyDaily", label: "Daily summary", help: "Orders, sign-ups and open flags", type: "toggle" }
      ] },
      { title: "Delivery", rows: [
        { key: "alertEmail", label: "Send alerts to", help: "Shared inbox for the admin team", type: "text" }
      ] }
    ]
  };

  // The Security card on the "Admins and roles" tab (the team and roles tables are drawn separately)
  CONFIG.admins = [
    { title: "Security", rows: [
      { key: "twoFactor", label: "Require two-factor sign-in", help: "For every admin account", type: "toggle" },
      { key: "sessionTimeout", label: "Session timeout", help: "Sign out after inactivity", type: "number", min: 5, max: 480, suffix: "minutes" }
    ] }
  ];

  var ROLES = [
    ["Super admin", "All settings, roles and payouts"],
    ["Moderator", "Approve events, handle reports, suspend users"],
    ["Finance", "Release payouts, issue refunds, view orders"],
    ["Support", "View users and orders, add notes"]
  ];

  var currentTab = "general";
  var form = JSON.parse(JSON.stringify(DB.settings)); // the working copy

  // ---------- tabs ----------
  function drawTabs() {
    document.getElementById("tabs").innerHTML = TABS.map(function (t) {
      return '<button data-tab="' + t[0] + '"' + (t[0] === currentTab ? ' class="active"' : "") + ">" + t[1] + "</button>";
    }).join("");
    document.querySelectorAll("[data-tab]").forEach(function (b) {
      b.onclick = function () { currentTab = b.dataset.tab; window.location.hash = currentTab; drawAll(); };
    });
  }

  function drawAll() {
    drawTabs();
    var area = document.getElementById("settings-area");
    if (currentTab === "admins") {
      drawAdminsTab(area);
      return;
    }
    var html = "";
    CONFIG[currentTab].forEach(function (group) {
      html += '<div class="card"><div class="card-head"><span class="label">' + group.title + "</span></div>";
      if (group.categories) html += '<div class="card-body" id="categories"></div>';
      else group.rows.forEach(function (row) { html += rowHtml(row); });
      html += "</div>";
    });
    area.innerHTML = html;

    if (document.getElementById("categories")) drawCategories();
    hookControls();
  }

  // ---------- one settings row ----------
  function rowHtml(row) {
    var value = form[row.key];
    var control = "";

    if (row.type === "text") {
      control = '<input type="text" data-key="' + row.key + '" value="' + esc(value) + '">';
    }
    if (row.type === "number") {
      control = '<input type="number" data-key="' + row.key + '" min="' + row.min + '" max="' + row.max + '" step="' + (row.step || 1) + '" value="' + value + '">' +
        (row.suffix ? '<span class="small muted" style="white-space:nowrap">' + row.suffix + "</span>" : "");
    }
    if (row.type === "select") {
      control = '<select data-key="' + row.key + '">' + row.options.map(function (o) {
        return "<option" + (o === value ? " selected" : "") + ">" + o + "</option>";
      }).join("") + "</select>";
    }
    if (row.type === "toggle") {
      control = '<span class="label" id="word-' + row.key + '">' + (value ? "On" : "Off") + "</span>" +
        '<label class="switch"><input type="checkbox" data-key="' + row.key + '"' + (value ? " checked" : "") + "><span></span></label>";
    }
    if (row.type === "seg") {
      control = '<div class="seg">' + row.options.map(function (o) {
        return '<button data-seg="' + row.key + '" data-value="' + o + '"' + (o === value ? ' class="active"' : "") + ">" + o + "</button>";
      }).join("") + "</div>";
    }

    if (row.badge) control += tag(row.badge);

    return '<div class="setting"><div><div class="name">' + row.label + '</div><div class="help">' + row.help + "</div></div>" +
      '<div class="control">' + control + "</div></div>";
  }

  // ---------- reading changes into the working copy ----------
  function findRow(key) {
    var found = null;
    Object.keys(CONFIG).forEach(function (tab) {
      CONFIG[tab].forEach(function (group) {
        (group.rows || []).forEach(function (row) { if (row.key === key) found = row; });
      });
    });
    return found;
  }

  function hookControls() {
    document.querySelectorAll("[data-key]").forEach(function (input) {
      input.onchange = function () {
        var row = findRow(input.dataset.key);
        if (row.type === "toggle") {
          form[row.key] = input.checked;
          document.getElementById("word-" + row.key).textContent = input.checked ? "On" : "Off";
        } else if (row.type === "number") {
          form[row.key] = input.value === "" ? "" : Number(input.value);
        } else {
          form[row.key] = input.value;
        }
        input.classList.remove("invalid");
      };
    });
    document.querySelectorAll("[data-seg]").forEach(function (button) {
      button.onclick = function () {
        form[button.dataset.seg] = button.dataset.value;
        drawAll();
      };
    });
  }

  // ---------- event categories (chips with add / remove) ----------
  function drawCategories() {
    var html = form.categories.map(function (c, i) {
      return '<span class="tag grey" style="margin:0 6px 6px 0; padding:6px 12px">' + esc(c) +
        ' <button data-remove="' + i + '" style="border:0; background:none; cursor:pointer">&times;</button></span>';
    }).join("");
    html += '<div class="row" style="margin-top:12px"><input type="text" id="new-category" placeholder="New category"><button class="btn" id="add-category" style="flex:0; white-space:nowrap">Add category</button></div>';
    html += '<p class="small muted" style="margin-top:10px">Organisers pick one per event.</p>';
    document.getElementById("categories").innerHTML = html;

    document.querySelectorAll("[data-remove]").forEach(function (b) {
      b.onclick = function () {
        if (form.categories.length === 1) { showToast("Keep at least one category.", true); return; }
        form.categories.splice(Number(b.dataset.remove), 1);
        drawCategories();
      };
    });
    document.getElementById("add-category").onclick = function () {
      var input = document.getElementById("new-category");
      var name = input.value.trim();
      if (name === "") return;
      var exists = form.categories.some(function (c) { return c.toLowerCase() === name.toLowerCase(); });
      if (exists) { showToast("That category already exists.", true); return; }
      form.categories.push(name);
      drawCategories();
    };
  }

  // ---------- Admins and roles tab (saved straight away, not with "Save changes") ----------
  function drawAdminsTab(area) {
    var teamRows = DB.admins.map(function (a) {
      return "<tr><td><b>" + esc(a.name) + '</b><div class="small muted">' + esc(a.email) + "</div></td><td>" + a.role + "</td><td>" + tag(a.status) +
        "</td><td>" + a.lastActive + '</td><td class="actions"><button class="btn small" data-manage="' + a.id + '">Manage</button></td></tr>';
    }).join("");

    var roleRows = ROLES.map(function (r) { return "<tr><td><b>" + r[0] + "</b></td><td>" + r[1] + "</td></tr>"; }).join("");

    area.innerHTML =
      '<div class="card"><div class="card-head"><span class="label">Admin team</span><button class="btn small primary" id="invite">Invite admin</button></div>' +
        '<table><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th></th></tr>' + teamRows + "</table></div>" +
      '<div class="card"><div class="card-head"><span class="label">Roles</span></div><table><tr><th>Role</th><th>Can do</th></tr>' + roleRows + "</table></div>" +
      '<div class="card"><div class="card-head"><span class="label">Security</span></div>' +
        CONFIG.admins[0].rows.map(rowHtml).join("") +
      "</div>";

    hookControls();
    document.getElementById("invite").onclick = openInviteModal;
    document.querySelectorAll("[data-manage]").forEach(function (b) {
      b.onclick = function () { openManageModal(b.dataset.manage); };
    });
  }

  function roleOptions(selected) {
    return ROLES.map(function (r) { return "<option" + (r[0] === selected ? " selected" : "") + ">" + r[0] + "</option>"; }).join("");
  }

  function openInviteModal() {
    openModal("Invite admin",
      '<div class="field"><label>Name</label><input type="text" id="inv-name"><div class="error" id="inv-name-error"></div></div>' +
      '<div class="field"><label>Email</label><input type="text" id="inv-email"><div class="error" id="inv-email-error"></div></div>' +
      '<div class="field"><label>Role</label><select id="inv-role">' + roleOptions("Support") + "</select></div>",
      [
        { text: "Cancel" },
        { text: "Send invite", className: "primary", onClick: function () {
            var name = document.getElementById("inv-name").value.trim();
            var email = document.getElementById("inv-email").value.trim();
            var ok = true;
            document.getElementById("inv-name-error").textContent = "";
            document.getElementById("inv-email-error").textContent = "";
            if (name === "") { document.getElementById("inv-name-error").textContent = "Please enter a name."; ok = false; }
            if (email.indexOf("@") < 1 || email.indexOf(".") < 0) { document.getElementById("inv-email-error").textContent = "Please enter a valid email."; ok = false; }
            else if (DB.admins.some(function (a) { return a.email.toLowerCase() === email.toLowerCase(); })) {
              document.getElementById("inv-email-error").textContent = "That person is already on the team."; ok = false;
            }
            if (!ok) return false;

            DB.admins.push({ id: newId("ad"), name: name, email: email, role: document.getElementById("inv-role").value, status: "Invited", lastActive: "Not yet" });
            saveDB();
            addAudit(ADMIN_NAME, "Invited admin", email);
            showToast("Invite sent to " + email);
            drawAll();
          } }
      ]);
  }

  function openManageModal(adminId) {
    var a = DB.admins.find(function (x) { return x.id === adminId; });
    var isMe = a.name === ADMIN_NAME;

    openModal("Manage " + a.name,
      '<p class="muted" style="margin-bottom:16px">' + esc(a.email) + "</p>" +
      '<div class="field"><label>Role</label><select id="manage-role"' + (isMe ? " disabled" : "") + ">" + roleOptions(a.role) + "</select>" +
      (isMe ? '<div class="hint">You cannot change your own role.</div>' : "") + "</div>",
      [
        { text: "Close" },
        { text: "Remove from team", className: "danger", onClick: function () {
            if (isMe) { showToast("You cannot remove yourself.", true); return false; }
            DB.admins = DB.admins.filter(function (x) { return x.id !== adminId; });
            saveDB();
            addAudit(ADMIN_NAME, "Removed admin", a.email);
            showToast(a.name + " removed");
            drawAll();
          } },
        { text: "Save role", className: "primary", onClick: function () {
            var role = document.getElementById("manage-role").value;
            if (role !== a.role) {
              addAudit(ADMIN_NAME, "Changed admin role to " + role, a.email);
              a.role = role;
              saveDB();
              showToast("Role updated");
              drawAll();
            }
          } }
      ]);
  }

  // ---------- Save and Discard ----------

  // Check the working copy. Returns a list of problems (empty list = fine).
  function checkForm() {
    var problems = [];
    if (form.platformName.trim() === "") problems.push("Platform name cannot be empty.");
    if (form.supportEmail.indexOf("@") < 1) problems.push("Support email is not a valid email.");
    if (form.alertEmail.indexOf("@") < 1) problems.push("Alert email is not a valid email.");
    if (form.descriptor.trim() === "") problems.push("Statement descriptor cannot be empty.");

    Object.keys(CONFIG).forEach(function (tab) {
      CONFIG[tab].forEach(function (group) {
        (group.rows || []).forEach(function (row) {
          if (row.type !== "number") return;
          var v = form[row.key];
          if (v === "" || isNaN(v) || v < row.min || v > row.max) {
            problems.push(row.label + " must be a number from " + row.min + " to " + row.max + ".");
          }
        });
      });
    });
    return problems;
  }

  // Which settings differ from the saved ones? Used for the audit log line.
  function changedKeys() {
    return Object.keys(form).filter(function (k) {
      return JSON.stringify(form[k]) !== JSON.stringify(DB.settings[k]);
    });
  }

  document.getElementById("save").onclick = function () {
    var problems = checkForm();
    if (problems.length > 0) { showToast(problems[0], true); return; }

    var changed = changedKeys();
    if (changed.length === 0) { showToast("Nothing to save."); return; }

    DB.settings = JSON.parse(JSON.stringify(form));
    saveDB();
    addAudit(ADMIN_NAME, "Updated settings", changed.join(", "));
    showToast("Settings saved");
  };

  document.getElementById("discard").onclick = function () {
    form = JSON.parse(JSON.stringify(DB.settings));
    drawAll();
    showToast("Changes discarded");
  };

  // open the right tab if the address has #payments etc.
  var hash = window.location.hash.replace("#", "");
  if (CONFIG[hash]) currentTab = hash;
  drawAll();
  </script>
